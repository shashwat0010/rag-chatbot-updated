name: Sync to Hugging Face space
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          mkdir deploy_dir
          git archive HEAD | tar -x -C deploy_dir
          cd deploy_dir
          
          # Dynamically inject the YAML frontmatter for Hugging Face Space configuration
          cat << 'EOF' > temp_readme_header
---
title: Medical Rag Chatbot
emoji: 🩺
colorFrom: blue
colorTo: green
sdk: docker
app_port: 7860
pinned: false
---

EOF
          cat temp_readme_header README.md > temp_readme && mv temp_readme README.md
          rm temp_readme_header

          git init
          git checkout -b main
          git add .
          git commit -m "Deploy application snapshot"
          git push -f https://Shas487f4ru:$HF_TOKEN@huggingface.co/spaces/Shas487f4ru/medical-rag-chatbot main


